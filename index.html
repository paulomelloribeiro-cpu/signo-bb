<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a0dad, #c77dff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #6a0dad;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background-color: #6a0dad;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #4b087d;
        }

        #resultado {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #6a0dad;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>✨ Descubra seu Signo ✨</h1>

        <p>Digite sua data de nascimento:</p>

        <input type="number" id="dia" placeholder="Dia" min="1" max="31">

        <input type="number" id="mes" placeholder="Mês" min="1" max="12">

        <br>

        <button onclick="descobrirSigno()">Descobrir meu signo</button>

        <p id="resultado"></p>
    </div>

    <script>
        function descobrirSigno() {
            let dia = Number(document.getElementById("dia").value);
            let mes = Number(document.getElementById("mes").value);

            let signo = "";

            if (dia < 1 || dia > 31 || mes < 1 || mes > 12) {
                document.getElementById("resultado").innerHTML =
                    "⚠️ Digite uma data válida!";
                return;
            }

            if ((mes == 3 && dia >= 21) || (mes == 4 && dia <= 19)) {
                signo = "♈ Áries";
            } 
            else if ((mes == 4 && dia >= 20) || (mes == 5 && dia <= 20)) {
                signo = "♉ Touro";
            } 
            else if ((mes == 5 && dia >= 21) || (mes == 6 && dia <= 20)) {
                signo = "♊ Gêmeos";
            } 
            else if ((mes == 6 && dia >= 21) || (mes == 7 && dia <= 22)) {
                signo = "♋ Câncer";
            } 
            else if ((mes == 7 && dia >= 23) || (mes == 8 && dia <= 22)) {
                signo = "♌ Leão";
            } 
            else if ((mes == 8 && dia >= 23) || (mes == 9 && dia <= 22)) {
                signo = "♍ Virgem";
            } 
            else if ((mes == 9 && dia >= 23) || (mes == 10 && dia <= 22)) {
                signo = "♎ Libra";
            } 
            else if ((mes == 10 && dia >= 23) || (mes == 11 && dia <= 21)) {
                signo = "♏ Escorpião";
            } 
            else if ((mes == 11 && dia >= 22) || (mes == 12 && dia <= 21)) {
                signo = "♐ Sagitário";
            } 
            else if ((mes == 12 && dia >= 22) || (mes == 1 && dia <= 19)) {
                signo = "♑ Capricórnio";
            } 
            else if ((mes == 1 && dia >= 20) || (mes == 2 && dia <= 18)) {
                signo = "♒ Aquário";
            } 
            else if ((mes == 2 && dia >= 19) || (mes == 3 && dia <= 20)) {
                signo = "♓ Peixes";
            }

            document.getElementById("resultado").innerHTML =
                "Seu signo é: " + signo + "!";
        }
    </script>

</body>
</html>
